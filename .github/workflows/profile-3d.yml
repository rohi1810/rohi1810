name: Update 3D Contribution Chart

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-3d-contrib:
    runs-on: ubuntu-latest
    name: Generate 3D Contribution Chart for Rohi1810

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      # Step 2: Generate 3D contribution chart
      - name: Generate 3D contribution chart
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: rohi1810

      # Step 3: Commit and push generated chart
      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "github-actions@github.com"

          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update 3D contribution chart"
            git push
          fi
